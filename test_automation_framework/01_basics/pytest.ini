[pytest]
# Конфигурация pytest для уровня 01_basics

# Дополнительные параметры командной строки по умолчанию
addopts =
    -v                          # Подробный вывод
    --tb=short                  # Короткий traceback
    --strict-markers            # Запретить неизвестные маркеры
    -p no:warnings              # Отключить плагин warnings (для чистоты вывода)

# Директории с тестами
testpaths = test_examples

# Пользовательские маркеры
markers =
    slow: медленные тесты (deselect with '-m "not slow"')
    fast: быстрые тесты
    smoke: smoke-тесты (критические проверки)
    regression: регрессионные тесты
    bug: тесты для известных багов
    integration: интеграционные тесты
    unit: модульные тесты

# Формат вывода
console_output_style = progress

# Таймаут для тестов (требуется pytest-timeout)
# timeout = 30
